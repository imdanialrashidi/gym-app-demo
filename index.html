<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#090B0A" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="REP//LAB — a cinematic, mobile-first bodybuilding training demo. Build beyond limits with Push, Pull and Legs protocols, live set logging and local progress analytics."
    />
    <meta name="application-name" content="REP//LAB" />
    <meta name="apple-mobile-web-app-title" content="REP//LAB" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%media/icon-180.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="REP//LAB — BUILD BEYOND LIMITS." />
    <meta
      property="og:description"
      content="A cinematic bodybuilding training demo. Push, pull and legs protocols with a live set log and progress that stays in your browser."
    />
    <meta property="og:image" content="https://imdanialrashidi.github.io/gym-app-demo/media/hero-og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="REP//LAB — BUILD BEYOND LIMITS." />
    <meta
      name="twitter:description"
      content="A cinematic bodybuilding training demo. Train. Log. Progress."
    />
    <meta name="twitter:image" content="https://imdanialrashidi.github.io/gym-app-demo/media/hero-og.jpg" />

    <link
      rel="preload"
      as="image"
      type="image/avif"
      media="(max-width: 767px)"
      href="%BASE_URL%media/hero-mobile-960.avif"
      imagesrcset="%BASE_URL%media/hero-mobile-640.avif 640w, %BASE_URL%media/hero-mobile-960.avif 960w, %BASE_URL%media/hero-mobile-1280.avif 1280w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      media="(min-width: 768px)"
      href="%BASE_URL%media/hero-wide-1440.avif"
      imagesrcset="%BASE_URL%media/hero-wide-960.avif 960w, %BASE_URL%media/hero-wide-1440.avif 1440w, %BASE_URL%media/hero-wide-1920.avif 1920w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <title>REP//LAB — BUILD BEYOND LIMITS.</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; color: #f5f6f2; background: #090b0a; font-family: sans-serif">
        <strong>REP//LAB</strong> needs JavaScript enabled to train.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
